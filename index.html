<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Connect · Backend Ready</title>

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== LOGIN PAGE ===== -->
    <div id="loginPage" class="login-page">
        <div class="login-header">
            <div class="company-logo">
                <i class="fas fa-building"></i>
                <span>HR Connect</span>
            </div>
            <div class="login-title">Welcome Back</div>
            <div class="login-sub">Sign in to your employee portal</div>
        </div>

        <div class="input-group">
            <label for="emailInput"><i class="far fa-envelope" style="margin-right: 6px; color:var(--primary);"></i> Email</label>
            <input type="email" id="emailInput" placeholder="alex.employee@gmail.com" value="alex.employee@gmail.com" />
        </div>

        <div class="input-group">
            <label for="passwordInput"><i class="fas fa-lock" style="margin-right: 6px; color:var(--primary);"></i> Password</label>
            <div class="password-wrapper">
                <input type="password" id="passwordInput" placeholder="••••••••" value="password123" />
                <button class="password-toggle" onclick="window.togglePassword()"><i class="fas fa-eye"></i></button>
            </div>
        </div>

        <button class="login-btn" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</button>

        <div class="login-actions">
            <a href="#" id="forgotPasswordLink"><i class="far fa-circle-question"></i> Forgot password?</a>
        </div>
    </div>

    <!-- ===== FORGOT PASSWORD PAGE ===== -->
    <div id="forgotPage" class="login-page" style="display:none;">
        <div class="login-header">
            <div class="company-logo">
                <i class="fas fa-building"></i>
                <span>HR Connect</span>
            </div>
            <div class="login-title" style="font-size:1.4rem;">Reset Password</div>
            <div class="login-sub">Enter your email to receive an OTP</div>
        </div>

        <div class="input-group">
            <label for="forgotEmail"><i class="far fa-envelope" style="margin-right: 6px; color:var(--primary);"></i> Email</label>
            <input type="email" id="forgotEmail" placeholder="your.email@company.com" />
        </div>

        <button class="login-btn" id="sendOtpBtn"><i class="fas fa-paper-plane"></i> Send OTP</button>

        <div id="otpSection" style="display:none; margin-top:1.5rem;">
            <p style="text-align:center;color:var(--text-secondary);font-size:0.9rem;">Enter the 6-digit OTP sent to your email</p>
            <div class="otp-input-group">
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
                <input type="text" maxlength="1" class="otp-input" />
            </div>
            <button class="login-btn" id="verifyOtpBtn" style="margin-top:0.5rem;"><i class="fas fa-check"></i> Verify OTP</button>
        </div>

        <div id="resetPasswordSection" style="display:none; margin-top:1.5rem;">
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password" />
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" />
            </div>
            <button class="login-btn" id="resetPasswordBtn"><i class="fas fa-key"></i> Reset Password</button>
        </div>

        <div class="back-to-login" id="backToLogin">
            <i class="fas fa-arrow-left"></i> Back to Login
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboardContainer" class="dashboard-container">
        <div class="app-layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-brand"><i class="fas fa-building"></i> HR Connect</div>
                <ul class="sidebar-nav" id="sidebarNav"></ul>
                <div class="sidebar-footer">
                    <button id="signOutSidebar"><i class="fas fa-right-from-bracket"></i> Sign out</button>
                </div>
            </aside>

            <main class="main-content">
                <nav class="top-nav">
                    <div style="display:flex;align-items:center;gap:1rem;">
                        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
                        <span class="welcome-text">Hi, <strong id="employeeNameDisplay">User</strong></span>
                        <span class="role-badge" id="roleBadge">Employee</span>
                    </div>
                    <div class="profile-icon" id="profileIcon"><i class="fas fa-user-circle"></i> Profile</div>
                </nav>

                <div class="content-sections" id="contentSections"></div>
            </main>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/renderers.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
