<!DOCTYPE html>
<html>
<head>
    <title>Test Backend</title>
</head>
<body>
    <h1>Backend API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
        const BASE_URL = 'https://your-backend-url.onrender.com/api';
        const TEST_EMAIL = 'hr.hr@gmail.com';
        const TEST_PASSWORD = 'hr123';

        async function testAPI() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';

            try {
                // Test 1: Login
                const loginRes = await fetch(`${BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: TEST_EMAIL, 
                        password: TEST_PASSWORD 
                    })
                });
                const loginData = await loginRes.json();
                result.textContent = 'Login Response:\n' + JSON.stringify(loginData, null, 2);

                if (loginData.token) {
                    // Test 2: Get Employees
                    const empRes = await fetch(`${BASE_URL}/employees`, {
                        headers: { 'Authorization': `Bearer ${loginData.token}` }
                    });
                    const empData = await empRes.json();
                    result.textContent += '\n\nEmployees Response:\n' + JSON.stringify(empData, null, 2);
                }
            } catch (error) {
                result.textContent = 'Error:\n' + error.message;
            }
        }
    </script>
</body>
</html>
